openapi: 3.0.0
info:
  title: Guest Reservation & Session API
  description: API for managing guest sessions, group reservations, and related operations
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://a7quy3t3fj.execute-api.eu-north-1.amazonaws.com/develop
    description: Develop environment

tags:
  - name: Authentication
    description: Customer authentication
  - name: Reservations
    description: Customer reservations
  - name: Guest Sessions
    description: Operations for guest sessions
  - name: Group Reservations
    description: Operations for group reservations

paths:
  /signin:
    post:
      tags:
        - Authentication
      summary: Sign in as a customer
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Customer authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations:
    post:
      tags:
        - Reservations
      summary: Create a reservation
      description: Creates a reservation. A guest group and owner session are created when guestCount is at least two.
      operationId: createReservation
      security:
        - cognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Invalid reservation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot create this reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/sessions/{guestSessionId}/dishes:
    post:
      tags:
        - Guest Sessions
      summary: Add dish to guest session
      description: Adds a dish to a guest's session cart with specified quantity
      operationId: addDishToGuestSession
      parameters:
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session
          schema:
            type: string
      security:
        - guestSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestSessionDishRequest'
      responses:
        '200':
          description: Dish added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request - missing guestSessionId, invalid body, or invalid dish/quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Group reservation expired or already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Guest Sessions
      summary: Remove dish from guest session
      description: Removes a dish from a guest's session cart with specified quantity
      operationId: removeDishFromGuestSession
      parameters:
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session
          schema:
            type: string
      security:
        - guestSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestSessionDishRequest'
      responses:
        '200':
          description: Dish removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request - missing guestSessionId, invalid body, or invalid dish/quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Group reservation expired or already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/sessions:
    post:
      tags:
        - Guest Sessions
      summary: Create guest session
      description: Creates a new guest session for a group reservation
      operationId: createGuestSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestSessionRequest'
      responses:
        '200':
          description: Guest session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGuestSessionResponse'
        '400':
          description: Invalid request - missing required fields or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/sessions/{guestSessionId}:
    get:
      tags:
        - Guest Sessions
      summary: Get guest session
      description: Returns the guest session cart, total, and submission status.
      operationId: getGuestSession
      parameters:
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session
          schema:
            type: string
      security:
        - guestSessionAuth: []
      responses:
        '200':
          description: Guest session retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGuestSessionResponse'
        '401':
          description: Missing or invalid guest session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Guest session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /group-reservations/{groupReservationId}/submit:
    post:
      tags:
        - Group Reservations
      summary: Submit group pre-order
      description: Owner submits a consolidated pre-order from submitted guest and owner sessions. Identical dishes are merged by dishId, written to the reservation order, and the group reservation is marked Submitted. The operation can only succeed once.
      operationId: submitGroupPreOrder
      parameters:
        - name: groupReservationId
          in: path
          required: true
          description: The ID of the group reservation
          schema:
            type: string
      security:
        - cognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitGroupReservationRequest'
      responses:
        '200':
          description: Group pre-order submitted successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsolidatedOrderItemResponse'
        '400':
          description: Invalid request, no submitted sessions, submitted sessions contain no dishes, or order was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the reservation owner can submit the group pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation or reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Group reservation is closed or has already been submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/groups/{groupReservationId}/status:
    get:
      tags:
        - Group Reservations
      summary: Get group reservation status
      description: Retrieves the current status of a group reservation
      operationId: getGroupReservationStatus
      security: []
      parameters:
        - name: groupReservationId
          in: path
          required: true
          description: The ID of the group reservation
          schema:
            type: string
      responses:
        '200':
          description: Group reservation status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupReservationStatusResponse'
        '400':
          description: Invalid request - missing groupReservationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/invites/{token}:
    get:
      tags:
        - Group Reservations
      summary: Get group reservation by invite token
      description: Retrieves group reservation details using an invite token
      operationId: getGroupReservationByToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The invite token for the group reservation
          schema:
            type: string
      responses:
        '200':
          description: Group reservation details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupReservationResponse'
        '400':
          description: Invalid request - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/groups/{groupReservationId}/sessions:
    get:
      tags:
        - Guest Sessions
      summary: Get all sessions for group reservation
      description: Returns group pre-order participants, their dishes, per-participant totals, and the group total. Only the reservation owner can call this endpoint.
      operationId: getAllSessionsForGroup
      parameters:
        - name: groupReservationId
          in: path
          required: true
          description: The ID of the group reservation
          schema:
            type: string
      security:
        - cognitoAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupSessionsResponse'
        '400':
          description: Invalid request - missing groupReservationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the reservation owner can view group sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation or parent reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/sessions/{guestSessionId}/submit:
    post:
      tags:
        - Guest Sessions
      summary: Submit guest cart
      description: Submits the cart for a guest session
      operationId: submitGuestCart
      parameters:
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session
          schema:
            type: string
      security:
        - guestSessionAuth: []
      responses:
        '200':
          description: Cart submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: GroupId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Group reservation expired, already submitted, or guest session already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/sessions/{guestSessionId}/menu:
    get:
      tags:
        - Guest Sessions
      summary: Get guest session menu
      description: Retrieves the menu available for a guest session
      operationId: getGuestSessionMenu
      parameters:
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session
          schema:
            type: string
      security:
        - guestSessionAuth: []
      responses:
        '200':
          description: Menu retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestMenuResponse'
        '400':
          description: Invalid request - missing guestSessionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid guest session token in Authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation or reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/{reservationId}/invite-token:
    get:
      tags:
        - Group Reservations
      summary: Get invite token for group reservation
      description: Retrieves the invite token for a group reservation
      operationId: getInviteToken
      security:
        - cognitoAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          description: The ID of the reservation
          schema:
            type: string
      responses:
        '200':
          description: Invite token retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupInviteTokenResponse'
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the reservation owner can retrieve the invite token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation or group reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reservation group is closed or already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /guest/groups/{groupReservationId}/sessions/{guestSessionId}:
    delete:
      tags:
        - Guest Sessions
      summary: Delete guest session
      description: Deletes a guest session from an open group reservation. Owner sessions and submitted groups cannot be deleted.
      operationId: deleteGuestSession
      parameters:
        - name: groupReservationId
          in: path
          required: true
          description: The ID of the group reservation
          schema:
            type: string
        - name: guestSessionId
          in: path
          required: true
          description: The ID of the guest session to delete
          schema:
            type: string
      security:
        - cognitoAuth: []
      responses:
        '200':
          description: Guest session deleted successfully. Returns the updated group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupSessionsResponse'
        '400':
          description: Invalid request, guest session belongs to another group, or the target is the owner session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the reservation owner can delete a guest session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation or guest session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Group reservation is closed or has already been submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/{reservationId}/guest-session-id:
    get:
      tags:
        - Guest Sessions
      summary: Get owner's guest session ID
      description: Retrieves the owner session ID and rotates its guest-session bearer token. Use the returned token to read, edit, and submit the owner's cart with the guest-session endpoints.
      operationId: getOwnerSessionId
      parameters:
        - name: reservationId
          in: path
          required: true
          description: The ID of the reservation
          schema:
            type: string
      security:
        - cognitoAuth: []
      responses:
        '200':
          description: Owner session ID retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerGuestSessionIdResponse'
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the reservation owner can get the owner session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation, group reservation, or owner guest session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cognitoAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication with JWT

    guestSessionAuth:
      type: http
      scheme: bearer
      description: Opaque base64 token returned by guest-session creation or the owner-session endpoint.

  schemas:
    UpdateGuestSessionDishRequest:
      type: object
      required:
        - dishId
        - quantity
      properties:
        dishId:
          type: string
          description: The ID of the dish to add or remove
          example: dish-123
        quantity:
          type: integer
          description: The quantity of the dish (must be greater than 0)
          example: 2
          minimum: 1

    CreateGuestSessionRequest:
      type: object
      required:
        - groupReservationId
        - guestName
      properties:
        groupReservationId:
          type: string
          description: The ID of the group reservation
          example: group-res-123
        guestName:
          type: string
          description: The name of the guest
          example: John Doe

    CreateGuestSessionResponse:
      type: object
      properties:
        SessionId:
          type: string
          description: Guest session ID (PascalCase in the API response)
          example: session-123
        SessionToken:
          type: string
          description: The authentication token for the guest session
          example: dG9rZW4=

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    SignInResponse:
      type: object
      properties:
        message:
          type: string
        idToken:
          type: string
        accessToken:
          type: string

    CreateReservationRequest:
      type: object
      required:
        - tableId
        - startTime
        - endTime
        - guestCount
      properties:
        tableId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        guestCount:
          type: integer
          minimum: 1
        customerEmail:
          type: string
          format: email
          description: Optional; used for waiter-created reservations.
        customerId:
          type: string
          nullable: true

    ReservationResponse:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        guestCount:
          type: integer
        status:
          type: string
          enum:
            - Reserved
            - Cancelled
            - InProgress
            - Completed
        customerId:
          type: string
          nullable: true
        waiterId:
          type: string
        locationAddress:
          type: string
        restaurantName:
          type: string
        hasSubmittedPreOrder:
          type: boolean
        guestInviteLinkAvailable:
          type: boolean

    SubmitGroupReservationRequest:
      type: object
      required:
        - reservationId
      properties:
        reservationId:
          type: string
          description: The ID of the reservation (owner of the group)
          example: res-123

    GroupReservationStatusResponse:
      type: object
      properties:
        currentParticipants:
          type: integer
          description: Current number of participants
          example: 3
        maxCapacity:
          type: integer
          description: Maximum capacity for the group
          example: 8
        status:
          type: string
          enum:
            - Open
            - Submitted
            - Closed
          description: Current status of the group reservation
          example: Open

    GetGroupReservationResponse:
      type: object
      properties:
        groupReservationId:
          type: string
          description: The ID of the group reservation
          example: group-res-123
        locationId:
          type: string
          description: The ID of the location
          example: loc-456
        restaurantName:
          type: string
          description: Name of the restaurant
          example: The Italian Corner
        locationAddress:
          type: string
          description: Address of the location
          example: 123 Main St, New York, NY
        startTime:
          type: string
          format: date-time
          description: Reservation start time
          example: 2024-12-20T19:00:00Z
        endTime:
          type: string
          format: date-time
          description: Reservation end time
          example: 2024-12-20T21:00:00Z
        maxGuestCount:
          type: integer
          description: Maximum number of guests allowed
          example: 8
        tableNumber:
          type: integer
          description: Table number for the reservation
          example: 5
        inviterName:
          type: string
          description: Name of the person who invited the guests
          example: Jane Doe

    GetGroupSessionsResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GroupSessionParticipant'
        total:
          type: number
          format: decimal
          description: Total cost for all participants
          example: 580

    GroupSessionParticipant:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Session ID of the participant
          example: session1
        type:
          type: string
          enum:
            - Owner
            - Guest
          description: Type of participant
          example: Guest
        name:
          type: string
          description: Name of the participant
          example: Andrii
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupSessionItem'
          description: Items ordered by the participant
        total:
          type: number
          format: decimal
          description: Total cost for this participant
          example: 360
        isSubmitted:
          type: boolean
          description: Whether the participant has submitted their cart
          example: true

    GroupSessionItem:
      type: object
      properties:
        dish:
          $ref: '#/components/schemas/GroupSessionDish'
        quantity:
          type: integer
          description: Quantity ordered
          example: 2

    GroupSessionDish:
      type: object
      properties:
        id:
          type: string
          example: dish1
        name:
          type: string
          example: Caesar Salad
        price:
          type: number
          format: decimal
          example: 180

    ConsolidatedOrderItemResponse:
      type: object
      properties:
        dishId:
          type: string
          example: dish1
        quantity:
          type: integer
          example: 3

    GetGroupInviteTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: The invite token for the group reservation
          example: inv_token_123456789

    OwnerGuestSessionIdResponse:
      type: object
      required:
        - guestSessionId
        - guestSessionToken
      properties:
        guestSessionId:
          type: string
          description: The guest session ID of the reservation owner
          example: session-owner-123
        guestSessionToken:
          type: string
          description: Rotating base64 bearer token for the owner session; keep it private.

    GetGuestSessionResponse:
      type: object
      properties:
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuestSessionOrderItem'
        total:
          type: number
        isSubmitted:
          type: boolean

    GuestSessionOrderItem:
      type: object
      properties:
        dish:
          $ref: '#/components/schemas/DishResponse'
        quantity:
          type: integer

    GuestMenuResponse:
      type: object
      properties:
        dishes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GuestMenuDish'

    GuestMenuDish:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        weight:
          type: string
        calories:
          type: string
        proteins:
          type: string
        fats:
